services:
  db:
    image: postgres:16-alpine
    container_name: navigator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator_dev_password
    ports:
      - "5433:5432"
    volumes:
      - navigator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: navigator-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://navigator:navigator_dev_password@db:5432/navigator
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-GigaChat-2-Pro}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  navigator_pgdata:
